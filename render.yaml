# Render deployment config — https://render.com/docs/blueprint-spec
#
# Point Render at this repo (New → Blueprint) and this file tells it how to
# build, run, and persist data for the PDI Inspection App.
#
# Cost estimate: Starter plan $7/month + 1 GB disk $0.25/month ≈ $7.25/month.
# Free tier works for a quick try but the web service spins down after 15 min
# of inactivity and does NOT retain the database or uploads between deploys.

services:
  - type: web
    name: pdi-inspection
    runtime: node
    plan: starter          # change to "free" to try it at $0, see caveats above
    region: oregon         # oregon, ohio, virginia, frankfurt, singapore
    branch: main
    rootDir: .
    buildCommand: |
      cd server && npm install --omit=dev &&
      cd ../client && npm install && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /health
    disk:
      name: pdi-data
      mountPath: /var/pdi-data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: development           # keeps local email/password auth active; no Azure needed
      - key: NODE_VERSION
        value: 22.11.0
      - key: PORT
        value: 3001
      - key: SQLITE_PATH
        value: /var/pdi-data/inspection.db
      - key: UPLOAD_DIR
        value: /var/pdi-data/uploads
      - key: MAX_FILE_SIZE_MB
        value: 25
      - key: DB_ADAPTER
        value: sqlite
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random value on first deploy
      - key: ADMIN_PASSWORD
        sync: false                  # you'll set this manually in the Render UI

      # ── Injector tests ───────────────────────────────────────────────────
      # The shop's clock: test times are shown, filtered and grouped in this
      # zone. Keep it the same as the client's VITE_INJECTOR_TIME_ZONE.
      - key: INJECTOR_TIME_ZONE
        value: America/Denver

      # Daily export of passed injectors to a Google Sheet. The three values
      # marked sync:false are set in the Render UI (Environment tab) and never
      # committed — a service account key in this file would be published with
      # the repository. The export stays off until they are set.
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false                  # from the sheet's URL, between /d/ and /edit
      - key: GOOGLE_SHEETS_RANGE
        value: Sheet1!A:C            # a tab name with a space needs single quotes
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false                  # client_email from the service account's JSON key
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false                  # private_key from the same file, newlines intact
      - key: INJECTOR_SHEET_EXPORT_AT
        value: "00:05"
